# Release smoke: installs a release APK built earlier in the same workflow run on an emulator and
# runs a Maestro flow against a named environment. Called by mootmaker-release/release.yml after
# each deploy, and by acceptance.yml against production, which proves this workflow on a pull
# request.
#   - production: the read-only demo sign-in (smoke/demo-sign-in.yaml). Nothing is written.
#   - anything else (test): sign up with a real emailed code, use the app, delete the account
#     (smoke/sign-up-lifecycle.yaml), the shape of the webapp's test-stage.spec.ts (design M8). Codes
#     come from the email helper, which needs AWS to read the shared queue. release-build.yml runs
#     the same flow against its own ephemeral environment, which is how a pull request proves it.
name: Smoke

on:
  workflow_call:
    inputs:
      artifact-name:
        description: The artifact from release-build.yml holding the APK.
        required: true
        type: string
      environment:
        description: test, production, or an ephemeral environment's name.
        required: true
        type: string
      ref:
        description: Commit of THIS repository whose smoke flow to run. Empty means the caller's own commit.
        required: false
        type: string
        default: ''

# id-token for the email helper's AWS access on test. A caller must grant it too.
permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # `repository` is explicit: in a called workflow a bare checkout clones the CALLER's repository.
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-android
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: apk
      - name: Check the APK's SHA-256
        working-directory: apk
        run: sha256sum -c ./*.sha256
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Only a writing flow needs codes. smoke.yml reaches test only from release.yml, whose token
      # (mootmaker-release at main) the release role trusts.
      - uses: actions/setup-node@v5
        if: inputs.environment != 'production'
        with:
          node-version: '24'
      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.environment != 'production'
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1
      - name: Start the email helper
        if: inputs.environment != 'production'
        run: .github/scripts/start-email-helper.sh
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke flow on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          FLOW: ${{ inputs.environment == 'production' && 'smoke/demo-sign-in.yaml' || 'smoke/sign-up-lifecycle.yaml' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            bash -c 'set -o pipefail; maestro test --format junit --output maestro-report.xml --debug-output maestro-debug -e ENVIRONMENT="$ENVIRONMENT" "$FLOW" 2>&1 | tee smoke.log'
      - name: Summarise failures
        if: always()
        run: python3 .github/scripts/summarise-failures.py "maestro-report.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-${{ inputs.environment }}-${{ github.run_attempt }}
          path: |
            smoke.log
            maestro-report.xml
            maestro-debug
