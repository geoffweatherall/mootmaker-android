name: pr-checks

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment for the demo-user e2e test (blank = production), e.g. and-acc-261007-ab12'
        type: string
        default: ''

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, unit, Robolectric and screenshot tests
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:lintDebug :data:testDebugUnitTest :app:verifyRoborazziDebug 2>&1 | tee build.log
      - name: Summarise failures
        if: always()
        run: |
          .github/scripts/gradle-errors.sh build.log
          python3 .github/scripts/summarise-failures.py "app/build/test-results/**/*.xml" "data/build/test-results/**/*.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports
            app/build/test-results
            app/build/outputs/roborazzi
            app/build/outputs/apk/debug
            data/build/reports
            data/build/test-results

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # e2e as the public demo user, read-only. See DemoUserE2eTest.
      - name: Read the e2e environment's configuration
        env:
          E2E_ENVIRONMENT: ${{ inputs.environment }}
        run: python3 .github/scripts/demo-e2e-args.py
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # bash with pipefail, so tee doesn't hide a failing Gradle exit code.
          script: bash -c 'set -o pipefail; ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notPackage=com.mootmaker.app.acceptance $E2E_ARGS 2>&1 | tee build.log'
      - name: Summarise failures
        if: always()
        run: |
          .github/scripts/gradle-errors.sh build.log
          python3 .github/scripts/summarise-failures.py "app/build/outputs/androidTest-results/**/*.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: |
            build.log
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
