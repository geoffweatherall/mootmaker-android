name: pr-checks

on:
  push:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, unit, Robolectric and screenshot tests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:recordRoborazziDebug
      - name: Summarise failures
        if: always()
        run: python3 .github/scripts/summarise-failures.py "app/build/test-results/**/*.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results
            app/build/outputs/roborazzi

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Summarise failures
        if: always()
        run: python3 .github/scripts/summarise-failures.py "app/build/outputs/androidTest-results/**/*.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports
          path: app/build/outputs/androidTest-results
