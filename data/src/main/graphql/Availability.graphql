# The room availability screen's one request: every room, one day's meetings and the window the
# server allows navigation in. Only the fields a booking row and a room card show are selected.
query Availability($dates: [String!]) {
  workspace(dates: $dates) {
    me {
      id
      timeFormat
    }
    rooms {
      id
      name
      capacity
      color
    }
    days {
      date
      meetings {
        id
        subject
        startTime
        endTime
        room {
          id
        }
      }
    }
    boundaries {
      earliestRetainedDate
      latestBookableDate
    }
  }
}
