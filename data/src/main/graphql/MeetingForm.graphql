# The Add Meeting form's reference data: who the caller is (the organiser defaults to them), everyone
# who can be picked, and the rooms with their capacity. Colour is selected only so the room list can
# be named the same way elsewhere; the form itself shows name and capacity.
query MeetingForm {
  workspace {
    me {
      id
      timeFormat
      dateFormat
    }
    people {
      id
      name
    }
    rooms {
      id
      name
      capacity
    }
  }
}

# The ranked rooms free for a slot that hold `requiredCapacity` people (organiser plus attendees).
# `excludingMeetingId` is sent only when editing, so the meeting's own slot doesn't count against its room.
query SuggestRoom($startTime: String!, $endTime: String!, $requiredCapacity: Int!, $excludingMeetingId: ID) {
  suggestRoom(startTime: $startTime, endTime: $endTime, requiredCapacity: $requiredCapacity, excludingMeetingId: $excludingMeetingId) {
    id
    name
    capacity
  }
}

# Rejected bookings come back as a successful response with `errors` set, not as a GraphQL error.
mutation CreateMeeting($meeting: MeetingInput!) {
  createMeeting(meeting: $meeting) {
    meeting {
      id
      startTime
    }
    errors
  }
}

# What the edit form starts from. `version` rides in the same request so it matches the fields shown;
# it goes back as `expectedVersion`, so a save made from a copy someone else has since changed is refused.
query EditMeeting($id: ID!) {
  meeting(id: $id) {
    id
    subject
    startTime
    endTime
    version
    room {
      id
    }
    organiser {
      id
    }
    attendees {
      person {
        id
      }
    }
  }
}

mutation UpdateMeeting($id: ID!, $meeting: MeetingInput!) {
  updateMeeting(id: $id, meeting: $meeting) {
    meeting {
      id
    }
    errors
  }
}
