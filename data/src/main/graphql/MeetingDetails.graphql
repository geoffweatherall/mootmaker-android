# The meeting details screen's writes. Its read comes from the workspace store (Days, MeetingById).

# A rejected response comes back as a successful response with `errors` set, not as a GraphQL error.
mutation RespondToMeeting($meetingId: ID!, $status: AttendeeStatus!) {
  respondToMeeting(meetingId: $meetingId, status: $status) {
    meeting {
      id
    }
    errors
  }
}

# Cancelling is a hard delete. Rejections come back in `errors`, as for the other writes.
mutation CancelMeeting($id: ID!) {
  cancelMeeting(id: $id) {
    errors
  }
}
